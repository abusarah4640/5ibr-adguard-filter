[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fivebr"
version = "2.2.0rc1"
description = "5ibr AdGuard Filter Development Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0" }

authors = [
    { name = "5ibr" }
]

dependencies = [
    "Flask==3.1.3",
    "Flask-Login==0.6.3",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]

testpaths = [
    "tests"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88


[project.scripts]
fivebr = "fivebr:main"
fivebr-web = "web.app:main"


[tool.setuptools]
py-modules = ["fivebr"]
packages = ["scripts", "scripts.builders", "scripts.services", "scripts.operations", "scripts.runtime", "scripts.runtime.seeds", "web"]

[tool.setuptools.package-data]
"web" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
"scripts.runtime.seeds" = [
    "config/*.json",
    "database/*.csv",
    "filters/*.txt",
]
