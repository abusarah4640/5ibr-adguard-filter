{% extends "base.html" %}
{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-3 page-header"><div><span class="badge text-bg-primary mb-2">{{ t('knowledge_report') }}</span><h1 class="mb-0">{{ title }}</h1></div></div>
<section class="card" id="report-viewer"><div class="card-header viewer-toolbar d-flex flex-wrap justify-content-between gap-2"><strong><i class="bi bi-filetype-md"></i> {{ t('report_viewer') }}</strong><div class="btn-group btn-group-sm" role="group"><button class="btn btn-outline-secondary" data-copy-target="#report-content"><i class="bi bi-copy"></i> {{ t('copy') }}</button><button class="btn btn-outline-secondary" data-download-target="#report-content" data-filename="5ibr-report.md"><i class="bi bi-download"></i> {{ t('download') }}</button><button class="btn btn-outline-secondary" data-print><i class="bi bi-printer"></i> {{ t('print') }}</button><button class="btn btn-outline-secondary" data-fullscreen-target="#report-viewer"><i class="bi bi-arrows-fullscreen"></i> {{ t('fullscreen') }}</button></div></div><div class="card-body p-0"><pre id="report-content" class="code-viewer with-lines border-0 rounded-0 mb-0 p-4">{{ text }}</pre></div></section>
{% endblock %}
