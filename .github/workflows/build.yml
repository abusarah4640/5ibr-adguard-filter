name: Build 5ibr Filters

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Validate Filters
        run: |
          python fivebr.py validate

      - name: Run Unit Tests
        run: |
          pytest -v

      - name: Build Releases
        run: |
          python fivebr.py build

      - name: Validate Built Releases
        run: |
          python fivebr.py validate

      - name: Analyze Query Log (Optional)
        run: |
          if [ -f querylog.json ]; then
            python -m scripts.analyze_querylog
          else
            echo "querylog.json not found, skipping analysis."
          fi

      - name: Generate Reports
        run: |
          if [ -f reports/new_candidates.csv ]; then
            python fivebr.py report
            python -m scripts.html_report
          else
            echo "No analysis results found, skipping reports."
          fi

      - name: Upload Release Files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fivebr-releases
          path: releases/
