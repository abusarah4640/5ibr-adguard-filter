name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements/ci.lock
          python -m pip install --no-deps --no-build-isolation --editable .

      - name: Compile CLI entrypoint
        run: |
          python -m py_compile fivebr.py

      - name: Build releases
        run: |
          python fivebr.py build

      - name: Validate built releases
        run: |
          python fivebr.py validate

      - name: Run statistics command
        run: |
          python fivebr.py stats

      - name: Run test suite
        run: |
          pytest -q

      - name: Build wheel
        run: |
          python -m build --wheel --no-isolation

      - name: Install wheel in clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --require-hashes -r requirements/runtime.lock
          .wheel-venv/bin/python -m pip install --no-deps dist/*.whl

      - name: Smoke test installed wheel
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/fivebr" version
