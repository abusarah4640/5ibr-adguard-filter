name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test and build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest
          python -m pip install --editable .

      - name: Compile CLI entrypoint
        run: |
          python -m py_compile fivebr.py

      - name: Build releases
        run: |
          python fivebr.py build

      - name: Validate built releases
        run: |
          python fivebr.py validate

      - name: Run statistics command
        run: |
          python fivebr.py stats

      - name: Run test suite
        run: |
          pytest -q

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Install wheel in clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --upgrade pip
          .wheel-venv/bin/python -m pip install dist/*.whl

      - name: Smoke test installed wheel
        run: |
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-venv/bin/fivebr" version
